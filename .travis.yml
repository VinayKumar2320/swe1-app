language: python

dist: jammy

python:
  - "3.14"

install:
  - pip install -r requirements.txt
  - pip install black flake8 coverage coveralls

script:
  - black --check --exclude '/(venv|\.venv|migrations)/' .
  - flake8 .
  - python manage.py check
  - coverage run --branch manage.py test
  - coverage report

after_success:
  - coveralls